    function result(){
      const p=currentPatient();
      return `<section class="shell">${header()}<div class="body"><div class="result-head"><div><span class="tag green">تأییدشده توسط پزشک</span><h1 style="margin-top:8px">گزارش بالینی ${p.name}</h1><p>بررسی دکتر رادمنش · امروز ساعت ۱۸:۴۰</p></div><div><button class="btn outline" onclick="go('dashboard')">بازگشت به داشبورد</button> <button class="btn outline" onclick="toast('نسخه چاپی گزارش آماده شد')">دریافت گزارش</button></div></div><div class="result-grid">${p.metrics.map(x=>`<div class="card metric"><small>${x[0]}</small><strong>${x[1]}</strong><em class="tag ${x[3]}">${x[2]}</em></div>`).join('')}</div><div class="two-col"><div class="card"><h2>جمع‌بندی پزشک</h2><div class="doctor-note">${p.summary}</div><h2 style="margin-top:18px">برنامه دارویی ثبت‌شده</h2><div class="med">💊 ${p.medication}؛ هرگونه تغییر دوز فقط با نظر پزشک معالج.</div><h2 style="margin-top:18px">هدف ۱۲ ماهه</h2><p style="font-size:.82rem">${p.goal}</p><h2 style="margin-top:18px">علائم هشدار</h2><p style="font-size:.78rem;color:var(--muted)">در صورت درد قفسه سینه، تنگی نفس شدید، غش یا بدترشدن ناگهانی علائم، منتظر پاسخ آنلاین نمانید و فوراً کمک پزشکی بگیرید.</p></div><aside class="card"><h2>تیم مراقبت شما</h2><div class="care-team"><span class="avatar">د‌ر</span><span><b>دکتر رادمنش</b><small style="display:block;color:var(--muted)">پزشک برنامه</small></span></div><div class="care-team" style="margin-top:12px"><span class="avatar">س‌م</span><span><b>سارا محمدی</b><small style="display:block;color:var(--muted)">مربی سلامت</small></span></div><hr style="border:0;border-top:1px solid var(--line);margin:17px 0"><p style="font-size:.78rem;color:var(--muted)">اقدام بعدی: ${p.next}</p><button class="btn primary wide" onclick="go('roadmap')">مشاهده نقشه مراقبت ۱۲ماهه</button></aside></div></div></section>`
    }
    function roadmap(){
      const p=currentPatient();
      const q=state.quarter;const visible=monthData.slice((q-1)*3,q*3);
      return `<section class="shell">${header()}<div class="body roadmap-wrap"><div class="roadmap-hero"><div><span class="tag green" style="background:#ffffff20;color:#fff">نقشه تأییدشده پزشک</span><h1>نقشه مراقبت ۱۲ماهه ${p.name}</h1><p>${p.condition} · هدف اصلی: ${p.goal}</p></div><div class="score"><span><b>۱۲</b><small>ماه همراهی</small></span></div></div><div class="quarter-tabs"><button class="qtab" onclick="go('dashboard')">داشبورد سلامت</button>${[1,2,3,4].map(n=>`<button class="qtab ${q===n?'on':''}" onclick="setQuarter(${n})">${n===1?'ماه ۱ تا ۳':n===2?'ماه ۴ تا ۶':n===3?'ماه ۷ تا ۹':'ماه ۱۰ تا ۱۲'}</button>`).join('')}</div><div class="months">${visible.map((x,i)=>`<article class="month ${x.m===1?'current':''}"><div class="month-no"><b>ماه ${fa(x.m)}</b><span class="tag ${x.tag==='آزمایش'||x.tag==='تصمیم'?'amber':x.m===12?'green':'blue'}">${x.tag}</span></div><h3>${x.t}</h3><ul>${x.items.map(a=>`<li>${a}</li>`).join('')}</ul><div class="due">نقطه پیگیری: <b>${x.due}</b></div></article>`).join('')}</div><div class="map-actions"><div class="legend">این نقشه بر اساس نتایج جدید و نظر پزشک به‌روزرسانی می‌شود.</div><div><button class="btn outline" onclick="toast('یادآوری‌های ماهانه فعال شد')">فعال‌سازی یادآوری‌ها</button> <button class="btn primary" onclick="toast('برنامه در پرونده ${p.name} ذخیره شد')">ذخیره در حساب من</button></div></div><div class="card" style="margin-top:17px"><h2>منطق برنامه در یک نگاه</h2><div class="what" style="margin:13px 0 0"><div><span>۱</span><b>ماه‌های ۱ تا ۳</b><br>تثبیت رفتار و اولین تصمیم</div><div><span>۲</span><b>ماه‌های ۴ تا ۶</b><br>پیشگیری و ارزیابی میان‌دوره</div><div><span>۳</span><b>ماه‌های ۷ تا ۱۲</b><br>حفظ نتیجه و مرور سالانه</div></div></div></div></section>`
    }
    function fa(n){return new Intl.NumberFormat('fa-IR').format(n)}
    function setQuarter(q){state.quarter=q;save();render();window.scrollTo(0,0)}
    function render(){const pages={start,otp,consent,identity,goals,assessment,historyReview,documents,membership,payment,processing,dashboard,result,roadmap};document.getElementById('app').innerHTML=(pages[state.screen]||start)()}
    render();
  </script>
</body>
</html>
