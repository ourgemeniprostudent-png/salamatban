function zoom(next,center=true){const old=scale,cx=(viewport.scrollLeft+viewport.clientWidth/2)/old,cy=(viewport.scrollTop+viewport.clientHeight/2)/old;scale=Math.max(.08,Math.min(2,next));canvas.style.width=layout.width*scale+'px';canvas.style.height=layout.height*scale+'px';slider.value=Math.round(scale*100);document.getElementById('percent').textContent=Math.round(scale*100).toLocaleString('fa-IR')+'٪';if(center){viewport.scrollLeft=cx*scale-viewport.clientWidth/2;viewport.scrollTop=cy*scale-viewport.clientHeight/2}}
function fit(){zoom((viewport.clientWidth-30)/layout.width,false);viewport.scrollTop=0;viewport.scrollLeft=0;document.querySelectorAll('[data-jump]').forEach(b=>b.setAttribute('aria-pressed','false'))}
function jump(id){const s=layout.sections.find(s=>s.number===id);if(!s)return;zoom(Math.min((viewport.clientWidth-45)/s.width,1.8),false);viewport.scrollLeft=Math.max(0,s.x*scale-15);viewport.scrollTop=Math.max(0,s.y*scale-15);document.querySelectorAll('[data-jump]').forEach(b=>b.setAttribute('aria-pressed',String(b.dataset.jump===id)));document.getElementById('jump').value=id}
document.querySelectorAll('[data-jump]').forEach(b=>b.onclick=()=>jump(b.dataset.jump));document.querySelectorAll('.flow-section').forEach(s=>s.onclick=()=>jump(s.dataset.number));document.getElementById('jump').onchange=e=>jump(e.target.value);document.getElementById('fit').onclick=fit;document.getElementById('in').onclick=()=>zoom(scale*1.3);document.getElementById('out').onclick=()=>zoom(scale/1.3);slider.oninput=()=>zoom(Number(slider.value)/100);document.fonts.ready.then(fit);window.addEventListener('resize',()=>{if(scale<.3)fit()});
</script></body></html>
