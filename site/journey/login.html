<main id="login-scene" class="login-scene" hidden aria-labelledby="login-title">
 <section class="login-content"><p class="scene-kicker">سلامت‌بان</p><h1 id="login-title" tabindex="-1">از همین‌جا شروع کنیم.</h1><p class="login-description">شماره حساب نمونه را وارد کن.</p>
 <form id="login-form" novalidate><div id="phone-step"><label for="login-phone">شماره همراه</label><input id="login-phone" type="tel" inputmode="tel" autocomplete="tel" maxlength="16" dir="ltr" placeholder="۰۹۱۲ ۱۲۳ ۴۵۶۷"><button type="submit" class="primary login-submit">دریافت کد نمایشی <span aria-hidden="true">←</span></button></div>
 <div id="code-step" hidden><div class="code-phone"><span id="code-phone-label"></span><button type="button" class="plain-button" id="edit-phone">تغییر شماره</button></div><label for="login-code">کد ورود</label><input id="login-code" type="text" inputmode="numeric" autocomplete="one-time-code" maxlength="6" dir="ltr" placeholder="— — — — — —"><div class="demo-code"><span>کد نمایشی</span><button type="button" id="copy-code" aria-label="کپی کد ورود"><b id="demo-code-value"></b><svg viewBox="0 0 24 24" aria-hidden="true"><rect x="8" y="8" width="12" height="12" rx="2"/><path d="M16 8V4H4v12h4"/></svg><span id="copy-feedback">کپی کد</span></button></div><button type="submit" class="primary login-submit">ورود به پرونده <span aria-hidden="true">←</span></button></div></form>
 <p id="login-feedback" role="status" class="login-feedback"></p><div class="sample-heading">یا یکی از حساب‌های نمونه را انتخاب کن</div><div id="sample-users" class="sample-users"></div><p class="login-note">نمایش با داده ساختگی · کدها واقعی نیستند و پیامک ارسال نمی‌شود.<br>اطلاعات هر کاربر در همین مرورگر نگهداری می‌شود.</p></section>
</main>
<dialog id="reset-dialog" class="review-dialog" aria-labelledby="reset-title"><div class="review-head"><h2 id="reset-title">ریست این کاربر</h2><button type="button" id="close-reset" class="plain-button">بستن ×</button></div><p class="scene-lead" id="reset-description"></p><div class="reset-actions"><button type="button" id="confirm-reset" class="primary">پاک کردن و شروع دوباره</button><button type="button" id="switch-user" class="plain-button">تغییر کاربر بدون پاک کردن اطلاعات</button></div><p id="reset-feedback" role="status"></p></dialog>
<div id="storage-error" class="storage-error" role="alert" hidden><span id="storage-error-text"></span><button type="button" onclick="location.reload()">تلاش دوباره</button></div>
